<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="app-version" content="v1.0.8" />
  <title>FFXIV Story & Trailer Tracker</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="readability.css" />
</head>
<body>
  <div class="top-progress">
    <div class="progress-wrap" aria-label="Story completion progress">
      <div class="progress-bar" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <div class="header-row">
        <div class="title-block">
          <div class="version-badge" id="appVersion">v1.0.8</div>
          <p class="eyebrow">Final Fantasy XIV</p>
          <h1>Chronological Story &amp; Trailer Tracker</h1>
        </div>
        <div class="stat-pill">
          <strong id="completionText">0 / 64 Complete</strong>
          <small>Story progress</small>
        </div>
      </div>

      <div class="next-step" id="nextStep">Next recommended step: A Realm Reborn</div>
    </header>

    <main>
      <section id="expandedView" class="view-panel">
        <div class="story-group">
          <div class="group-header">
            <h2>Expanded: Complete MSQ Questbook</h2>
            <div class="group-meta">Chronological MSQ titles and patch chapters</div>
          </div>

          <ul id="expandedQuestBook" class="expanded-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
  <script>
    // Keep the release badge current until the app's own version history is updated.
    const versionBadge = document.getElementById('appVersion');
    const currentVersion = document.querySelector('meta[name="app-version"]').content;
    if (versionBadge) {
      versionBadge.textContent = currentVersion;
      new MutationObserver(() => {
        if (versionBadge.textContent !== currentVersion) versionBadge.textContent = currentVersion;
      }).observe(versionBadge, { childList: true, characterData: true, subtree: true });
    }
  </script>
</body>
</html>
